<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gwent — The Witcher 3 Remastered</title>

<style>
:root {
    --bg: #101310;
    --panel: #1b201b;
    --gold: #c5a66a;
    --text: #eee8dc;
    --muted: #a7a99f;
    --green: #6dbb75;
    --border: #45483d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
}

header {
    text-align: center;
    padding: 38px 16px 28px;
    background: linear-gradient(#24291f, var(--bg));
    border-bottom: 1px solid var(--border);
}

.eyebrow {
    color: var(--gold);
    letter-spacing: 4px;
    font-size: 12px;
    text-transform: uppercase;
}

h1 {
    margin: 14px 0 8px;
    font-size: clamp(26px, 5vw, 44px);
    text-transform: uppercase;
}

.subtitle {
    color: var(--muted);
    margin: 0 auto;
    max-width: 650px;
    line-height: 1.6;
}

.language-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 22px;
}

button, select, input {
    font: inherit;
}

button, select, input {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 13px;
}

button {
    background: #292e26;
    color: var(--text);
    cursor: pointer;
}

button:hover {
    border-color: var(--gold);
}

button.active {
    border-color: var(--gold);
    color: var(--gold);
}

main {
    max-width: 1200px;
    padding: 24px 16px 60px;
    margin: auto;
}

.progress-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
}

.progress-heading {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
}

.progress-heading strong {
    color: var(--gold);
    font-size: 20px;
}

.progress-track {
    height: 12px;
    border-radius: 20px;
    background: #080a08;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0;
    background: var(--green);
    transition: width .25s;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
}

input, select {
    background: var(--panel);
    color: var(--text);
}

#search {
    flex: 1 1 220px;
    min-width: 0;
}

.section-title {
    color: var(--gold);
    font-size: 22px;
    margin: 24px 0 16px;
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 16px;
}

.card {
    position: relative;
    padding: 8px;
    background: #20251e;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: transform .2s, border-color .2s;
    text-align: center;
    color: var(--text);
    min-width: 0;
}

.card:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
}

.card img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 4px;
    background: #30352d;
    filter: grayscale(1);
    opacity: .42;
    transition: filter .25s, opacity .25s;
}

.card.collected img {
    filter: grayscale(0);
    opacity: 1;
}

.card-name {
    display: block;
    padding: 10px 2px 4px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.card-status {
    display: block;
    color: var(--muted);
    font-size: 12px;
    padding-bottom: 5px;
}

.card.collected {
    border-color: var(--green);
}

.card.collected .card-status {
    color: var(--green);
}

.checkmark {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 30px;
    height: 30px;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--green);
    color: #071007;
    border: 2px solid #e6f5df;
    border-radius: 50%;
    font-family: Arial, sans-serif;
    font-size: 20px;
    font-weight: bold;
    z-index: 1;
}

.card.collected .checkmark {
    display: flex;
}

.empty {
    color: var(--muted);
    padding: 28px 0;
    text-align: center;
    grid-column: 1 / -1;
}

footer {
    text-align: center;
    border-top: 1px solid var(--border);
    padding: 22px 12px;
    color: var(--muted);
    font-size: 13px;
}

@media (max-width: 480px) {
    .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .progress-panel {
        padding: 15px;
    }
}
</style>
</head>

<body>
<header>
    <div class="eyebrow">The Witcher 3 Remastered</div>
    <h1 id="title">Guia de Cartas de Gwent</h1>
    <p class="subtitle" id="subtitle">
        Sua coleção de cartas. Marque as que você já conseguiu!
    </p>

    <div class="language-bar">
        <button class="active" id="ptButton" type="button">🇧🇷 Português</button>
        <button id="enButton" type="button">🇺🇸 English</button>
    </div>
</header>

<main>
    <section class="progress-panel">
        <div class="progress-heading">
            <span id="progressLabel">Progresso da coleção</span>
            <strong id="progressCount">0 / 5</strong>
            <span id="progressPercent">0%</span>
        </div>
        <div
            class="progress-track"
            id="progressTrack"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-label="Collection progress"
        >
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </section>

    <section class="controls">
        <input id="search" type="search" placeholder="Buscar carta...">

        <select id="filter" aria-label="Filtrar cartas">
            <option value="all">Todas as cartas</option>
            <option value="pending">Cartas pendentes</option>
            <option value="collected">Cartas coletadas</option>
        </select>

        <select id="groupFilter" aria-label="Filtrar por tipo de carta">
            <option value="all">Todas as categorias</option>
            <option value="starting">Cartas iniciais</option>
            <option value="collection">Coleção completa</option>
        </select>

        <select id="faction" aria-label="Filtrar por facção">
            <option value="all">Todas as facções</option>
            <option value="neutral">Neutras</option>
            <option value="north">Reinos do Norte</option>
            <option value="nilfgaard">Nilfgaard</option>
            <option value="scoiatael">Scoia'tael</option>
            <option value="monsters">Monstros</option>
            <option value="skellige">Skellige</option>
        </select>   
        
        <button id="toggleAllButton" type="button">
            Selecionar todas
        </button>
    </section>

    <h2 class="section-title" id="cardsHeading">Coleção de cartas</h2>

    <section class="card-grid" id="cardGrid" aria-live="polite"></section>
</main>

<footer id="footer">
    Protótipo do guia interativo de Gwent.
</footer>

const storageKey = "witcher-gwent-checklist-v1";

let language = "pt";
let collected = {};

try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
    collected = saved && typeof saved === "object" && !Array.isArray(saved)
        ? saved
        : {};
} catch {
    collected = {};
}

const grid = document.getElementById("cardGrid");
const search = document.getElementById("search");
const filter = document.getElementById("filter");
const faction = document.getElementById("faction");
const groupFilter = document.getElementById("groupFilter");

function saveProgress() {
    try {
        localStorage.setItem(storageKey, JSON.stringify(collected));
    } catch {
        alert(language === "pt"
            ? "Não foi possível salvar no navegador."
            : "Could not save progress in this browser.");
    }
}

function makeCardImage(card) {
    if (card.image) {
        return card.image;
    }

    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">
            <rect width="300" height="400" rx="12" fill="${card.color || "#777777"}"/>
            <text x="150" y="200" text-anchor="middle"
                font-family="Georgia,serif" font-size="20"
                fill="#fff4d7">GWENT</text>
        </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);
}
function getVisibleCards() {
    const query = search.value.trim().toLocaleLowerCase();
    const selectedFilter = filter.value;
    const selectedFaction = faction.value;
    const selectedGroup = groupFilter.value;

    return cards.filter(card => {
        const name = card[language].toLocaleLowerCase();
        const matchesSearch = name.includes(query);
        const isCollected = Boolean(collected[card.id]);

        const matchesStatus =
            selectedFilter === "all" ||
            (selectedFilter === "collected" && isCollected) ||
            (selectedFilter === "pending" && !isCollected);

        const sourcePath = (card.sourcePath || "").toLowerCase();
        const isStartingCard = card.group === "starting";
        const isNeutralCollection = sourcePath.includes("/completo/neutros/");
        const isNeutral = isStartingCard || isNeutralCollection;

        const isNilfgaardNeutral =
            sourcePath.includes("/iniciais/iniciais nilfi/") ||
            sourcePath.includes("/completo/neutros/nilfi neutros/");

        const neutralVariant =
            sourcePath.includes("/neutros/nilfi neutros/") ||
            sourcePath.includes("/iniciais/iniciais nilfi/")
                ? "nilfgaard"
                : sourcePath.includes("/neutros/monstros neutros/") ||
                  sourcePath.includes("/iniciais/iniciais monstros/")
                    ? "monsters"
                    : sourcePath.includes("/neutros/norte neutros/") ||
                      sourcePath.includes("/iniciais/iniciais norte/")
                        ? "north"
                        : sourcePath.includes("/neutros/elfos neutros/") ||
                          sourcePath.includes("/iniciais/iniciais scoiatel/")
                            ? "scoiatael"
                            : null;

        const matchesFaction =
            selectedFaction === "all"
                ? (!isNeutral || isNilfgaardNeutral)
                : neutralVariant !== null
                    ? neutralVariant === selectedFaction
                    : card.faction === selectedFaction;

        const matchesGroup =
            selectedGroup === "all" || card.group === selectedGroup;

        return (
            matchesSearch &&
            matchesStatus &&
            matchesFaction &&
            matchesGroup
        );
    });
}

    const query = search.value.trim().toLocaleLowerCase();

        const sourcePath = (card.sourcePath || "").toLowerCase();

const isStartingCard = card.group === "starting";

const isNeutralCollection = sourcePath.includes("/completo/neutros/");

const isNeutral = isStartingCard || isNeutralCollection;

const neutralVariant =

                    : null;

const isNilfgaardNeutral =

const matchesFaction =
    selectedFaction === "all"
        ? (!isNeutral || isNilfgaardNeutral)
        : neutralVariant !== null
            ? neutralVariant === selectedFaction
            : card.faction === selectedFaction;

return matchesSearch && matchesStatus && matchesFaction;
    });

    grid.innerHTML = "";

    if (visibleCards.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = t.empty;
        grid.appendChild(empty);
        updateProgress();
        return;
    }

    visibleCards.forEach(card => {
        const isCollected = Boolean(collected[card.id]);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "card" + (isCollected ? " collected" : "");
        button.setAttribute("aria-pressed", String(isCollected));
        button.setAttribute(
            "aria-label",
            card[language] + (isCollected ? ", " + t.obtained : ", " + t.missing)
        );

        const check = document.createElement("span");
        check.className = "checkmark";
        check.textContent = "✓";
        check.setAttribute("aria-hidden", "true");

        img.alt = language === "pt"
            ? "Carta de Gwent: " + card.pt

        img.loading = "lazy";

        name.className = "card-name";
        name.textContent = card[language];

        status.className = "card-status";
        status.textContent = isCollected ? t.obtained : t.missing;

        button.append(check, img, name, status);

    const sourcePath = (card.sourcePath || "").toLowerCase();

    const isStartingCard = card.group === "starting";
    const isNeutralCollection = sourcePath.includes("/completo/neutros/");
    const isNeutral = isStartingCard || isNeutralCollection;

    // Define o novo estado da carta
    const newState = !collected[card.id];

    if (isNeutral) {
        // Identifica as versões da mesma carta pelo nome
        const cardName = (card.pt || "").trim().toLocaleLowerCase();

        const relatedCards = cards.filter(otherCard => {
            const otherPath = (otherCard.sourcePath || "").toLowerCase();

            const otherIsNeutral =
                otherCard.group === "starting" ||
                otherPath.includes("/completo/neutros/");

            const otherName = (otherCard.pt || "").trim().toLocaleLowerCase();

            return otherIsNeutral && otherName === cardName;
        });

        // Atualiza todas as versões da carta neutra
        relatedCards.forEach(otherCard => {
            collected[otherCard.id] = newState;
        });
    } else {
        // Cartas exclusivas continuam com progresso independente
        collected[card.id] = newState;
    }

    saveProgress();
    renderCards();
});

        grid.appendChild(button);
    });

    updateProgress();
}
    const toggleAllButton = document.getElementById("toggleAllButton");

function updateToggleAllButton() {
    const visibleCards = getVisibleCards();

    const allCollected =
        visibleCards.length > 0 &&
        visibleCards.every(card => Boolean(collected[card.id]));

    toggleAllButton.textContent = allCollected
        ? "Desmarcar todas"
        : "Selecionar todas";

    toggleAllButton.disabled = visibleCards.length === 0;
}

toggleAllButton.addEventListener("click", () => {
    const visibleCards = getVisibleCards();

    if (visibleCards.length === 0) return;

    const allCollected =
        visibleCards.every(card => Boolean(collected[card.id]));

    const newState = !allCollected;

    visibleCards.forEach(card => {
        const sourcePath = (card.sourcePath || "").toLowerCase();
        const isNeutral =
            card.group === "starting" ||
            sourcePath.includes("/completo/neutros/");

        if (isNeutral) {
            const cardName = (card.pt || "").trim().toLocaleLowerCase();

            cards.forEach(otherCard => {
                const otherPath = (otherCard.sourcePath || "").toLowerCase();

                const otherIsNeutral =
                    otherCard.group === "starting" ||
                    otherPath.includes("/completo/neutros/");

                const otherName =
                    (otherCard.pt || "").trim().toLocaleLowerCase();

                if (otherIsNeutral && otherName === cardName) {
                    collected[otherCard.id] = newState;
                }
            });
        } else {
            collected[card.id] = newState;
        }
    });

    saveProgress();
    renderCards();
    updateToggleAllButton();
});

function updateProgress() {
    const t = translations[language];

    const selectedFaction = faction.value;
    const selectedGroup = groupFilter.value;

    const visibleCards = cards.filter(card => {
        const sourcePath = (card.sourcePath || "").toLowerCase();

        const isStartingCard = card.group === "starting";
        const isNeutralCollection = sourcePath.includes("/completo/neutros/");
        const isNeutral = isStartingCard || isNeutralCollection;

        const isNilfgaardNeutral =
            sourcePath.includes("/iniciais/iniciais nilfi/") ||
            sourcePath.includes("/completo/neutros/nilfi neutros/");

        const neutralVariant =
            sourcePath.includes("/neutros/nilfi neutros/") ||
            sourcePath.includes("/iniciais/iniciais nilfi/")
                ? "nilfgaard"
                : sourcePath.includes("/neutros/monstros neutros/") ||
                  sourcePath.includes("/iniciais/iniciais monstros/")
                    ? "monsters"
                    : sourcePath.includes("/neutros/norte neutros/") ||
                      sourcePath.includes("/iniciais/iniciais norte/")
                        ? "north"
                        : sourcePath.includes("/neutros/elfos neutros/") ||
                          sourcePath.includes("/iniciais/iniciais scoiatel/")
                            ? "scoiatael"
                            : null;

        const matchesFaction =
            selectedFaction === "all"
                ? (!isNeutral || isNilfgaardNeutral)
                : isNeutral
                    ? neutralVariant === selectedFaction
                    : card.faction === selectedFaction;

        const matchesGroup =
            selectedGroup === "all" || card.group === selectedGroup;

        return matchesFaction && matchesGroup;
    });

    const total = visibleCards.length;

    const count = visibleCards.filter(card =>
        Boolean(collected[card.id])
    ).length;

    const percent = total ? Math.round(count / total * 100) : 0;

    document.getElementById("progressLabel").textContent = t.progress;
    document.getElementById("progressCount").textContent = count + " / " + total;
    document.getElementById("progressPercent").textContent = percent + "%";
    document.getElementById("progressFill").style.width = percent + "%";
    document.getElementById("progressTrack").setAttribute("aria-valuenow", percent);
}

function setLanguage(nextLanguage) {
    language = nextLanguage;
    const t = translations[language];

    document.documentElement.lang = language === "pt" ? "pt-BR" : "en";
    document.getElementById("title").textContent = t.title;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("cardsHeading").textContent = t.heading;
    document.getElementById("footer").textContent = t.footer;
    search.placeholder = t.search;

    filter.options[0].textContent = t.all;
    filter.options[1].textContent = t.pending;
    filter.options[2].textContent = t.collected;

    groupFilter.options[0].textContent = t.allGroups;
    groupFilter.options[1].textContent = t.starting;
    groupFilter.options[2].textContent = t.collection;

    faction.options[0].textContent = t.allFactions;
    [...faction.options].slice(1).forEach(option => {
        option.textContent = t.factions[option.value];
    });

    document.getElementById("ptButton").classList.toggle("active", language === "pt");
    document.getElementById("enButton").classList.toggle("active", language === "en");

    renderCards();
}

document.getElementById("ptButton").addEventListener("click", () => setLanguage("pt"));
document.getElementById("enButton").addEventListener("click", () => setLanguage("en"));
search.addEventListener("input", renderCards);
filter.addEventListener("change", renderCards);
faction.addEventListener("change", renderCards);
groupFilter.addEventListener("change", renderCards);

setLanguage("pt");
</script>
</body>
</html>
